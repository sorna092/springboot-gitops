# Only Traefik (ingress) and Prometheus (monitoring) may talk to the app
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: springboot-app-allow
spec:
  podSelector:
    matchLabels:
      app: springboot-app
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
